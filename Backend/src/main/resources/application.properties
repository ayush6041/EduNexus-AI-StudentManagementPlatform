spring.application.name=SMS

# ---------------- Database (override with environment variables) ----------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studentdb?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------- JWT (JWT_SECRET must be >= 32 chars in production) ----------------
app.jwt.secret=${JWT_SECRET:DEV-ONLY-change-this-secret-before-deploying-0123456789}
app.jwt.expiration-minutes=60

# ---------------- CORS / links ----------------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ---------------- Seeded SUPER ADMIN (only if none exists; must change password on first login) ----------------
app.admin.username=${ADMIN_USERNAME:superadmin}
app.admin.email=${ADMIN_EMAIL:admin@sms.local}
app.admin.password=${ADMIN_PASSWORD:ChangeMe@2026}

# ---------------- Security tuning ----------------
app.temp-password-hours=48
app.otp.expiry-minutes=10
app.otp.max-attempts=5
app.login.max-failed-attempts=5
app.login.lock-minutes=15
app.admit-card.days-before=14

# ---------------- Email (when disabled, credentials/OTPs are printed to the console - dev only) ----------------
app.mail.enabled=${MAIL_ENABLED:true}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
